name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.repository == 'ESAOpenSR/SEN2SR' && !github.event.release.prerelease
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    if: github.event_name == 'release' && github.repository == 'ESAOpenSR/SEN2SR' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Install wheel and test dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl pytest==7.4.4
          python -m pip check
      - name: Test installed wheel outside the source checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cp -R tests "$RUNNER_TEMP/installed-tests"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from pathlib import Path
          import sen2sr

          if Path(sen2sr.__file__).is_relative_to(Path(os.environ["GITHUB_WORKSPACE"])):
              raise SystemExit("Imported the checkout instead of the installed wheel")
          if f"v{sen2sr.__version__}" != os.environ["RELEASE_TAG"]:
              raise SystemExit("Installed wheel version does not match the release tag")
          print(sen2sr.__version__, sen2sr.__file__)
          PY
          python -m pytest -q --rootdir="$RUNNER_TEMP/installed-tests" "$RUNNER_TEMP/installed-tests"

  publish:
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sen2sr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish verified distributions using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
