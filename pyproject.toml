[tool.poetry]
name = "sen2sr"
version = "0.8.6"
description = "A Python package to super-resolve Sentinel-2 satellite imagery up to 2.5 meters."
authors = ["Cesar Aybar <cesar.aybar@uv.es>", "Julio Contreras <julio.contreras@uv.es>"]
license = "CC0-1.0"
repository = "https://github.com/ESAOpenSR/sen2sr"
documentation = "https://esaopensr.github.io/sen2sr/"
readme = "README.md"
packages = [
  {include = "sen2sr"},
]
include = [
  {path = "CHANGELOG.md", format = "sdist"},
  {path = "CITATION.cff", format = "sdist"},
  {path = "CONTRIBUTING.md", format = "sdist"},
  {path = "tests", format = "sdist"},
]

[tool.poetry.urls]
"Issues" = "https://github.com/ESAOpenSR/SEN2SR/issues"
"Changelog" = "https://github.com/ESAOpenSR/SEN2SR/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
tqdm = ">=4.67.1"
numpy = ">=2.0.2"
einops = ">=0.8.1"
timm = ">=1.0.15"
torchvision = ">=0.21"


[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
deptry = "^0.16.2"
mypy = "^1.5.1"
pre-commit = "^3.4.0"
tox = "^4.11.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.4.2"
mkdocs-material = "^9.2.7"
mkdocstrings = {extras = ["python"], version = "^0.26.1"}

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
files = ["sen2sr"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["sen2sr"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
